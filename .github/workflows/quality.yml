name: Frontend quality

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build, coverage and Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: http://127.0.0.1:3000/api/v1
      VITE_APP_NAME: AutoPro System CI
      VITE_ADMIN_PANEL_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Build
        run: npm run build

      - name: Unit and component coverage baseline
        run: npm run test:coverage

      - name: Chromium E2E with local fixtures
        run: npm run test:e2e

      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
